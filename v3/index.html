<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worcadian Agent</title>
  <link rel="icon" type="image/png" href="https://whatgamestudios.com/worcadian/worcadian-logo.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2e9d8;
      --ink: #2b2420;
      --accent: #96682d;
      --panel: #fffdf8;
      --border: #d8c7a4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1712;
        --ink: #ece3d4;
        --accent: #d3a45e;
        --panel: #262019;
        --border: #4a3d2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3rem 2rem;
    }
    h1 {
      letter-spacing: 0.04em;
      margin: 0 0 2rem;
    }
    a.login-button {
      display: inline-block;
      padding: 0.7rem 1.75rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: var(--panel);
    }
  </style>
</head>
<body>
  <main>
    <h1>Worcadian Agent</h1>
    <a class="login-button" href="/auth/login">Log in</a>
  </main>
</body>
</html>
