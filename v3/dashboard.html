<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worcadian Agent</title>
  <link rel="icon" type="image/png" href="https://whatgamestudios.com/worcadian/worcadian-logo.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2e9d8;
      --ink: #2b2420;
      --accent: #96682d;
      --panel: #fffdf8;
      --border: #d8c7a4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1712;
        --ink: #ece3d4;
        --accent: #d3a45e;
        --panel: #262019;
        --border: #4a3d2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    main {
      width: 100%;
      max-width: 720px;
    }
    h1 {
      text-align: center;
      letter-spacing: 0.04em;
      margin: 0 0 0.25rem;
    }
    .subtitle {
      text-align: center;
      color: var(--accent);
      font-style: italic;
      margin: 0 0 2rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.4rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    .field { flex: 1 1 200px; }
    input[type="number"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
    }
    button {
      padding: 0.6rem 1.1rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: var(--panel);
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    textarea {
      width: 100%;
      min-height: 320px;
      padding: 0.85rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
      resize: vertical;
    }
    .status {
      min-height: 1.2rem;
      margin: 0.5rem 0 0.75rem;
      font-style: italic;
      color: var(--accent);
    }
    .definitions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .definition-box textarea {
      min-height: 90px;
    }
    .word-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }
    .word-row label {
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.9rem;
      margin-bottom: 0;
    }
    .card-button {
      padding: 0.3rem 0.7rem;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #word-card {
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Worcadian Agent</h1>
    <p class="subtitle">
      Daily press release generator ·
      <a href="/auth/logout" style="color: var(--accent);">Log out</a>
    </p>

    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="game-day">Game day</label>
          <input id="game-day" type="number" min="1" placeholder="Current game day" />
        </div>
        <button id="run-button" type="button">Execute Daily Tasks</button>
      </div>

      <div id="status" class="status"></div>

      <label>Seed Word</label>
      <div id="seed-word" class="definitions"></div>

      <label style="margin-top: 1.25rem;">Words Used</label>
      <div id="words-used" class="definitions"></div>

      <div id="card-section" style="display: none; margin-top: 1.25rem;">
        <label for="word-card">Word Card</label>
        <img id="word-card" alt="Word card" />
      </div>
    </div>
  </main>

  <script>
    const runButton = document.getElementById("run-button");
    const dayInput = document.getElementById("game-day");
    const status = document.getElementById("status");
    const seedWordContainer = document.getElementById("seed-word");
    const wordsUsedContainer = document.getElementById("words-used");
    const cardSection = document.getElementById("card-section");
    const wordCard = document.getElementById("word-card");

    async function generateCard(word, entry, button) {
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = "Generating...";
      try {
        const response = await fetch("/api/word-card", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            word,
            part_of_speech: entry.part_of_speech,
            definition: entry.definition || entry.short_definition,
          }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        wordCard.src = data.card_image;
        cardSection.style.display = "block";
        cardSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (err) {
        status.textContent = `Error generating card: ${err.message}`;
      } finally {
        button.disabled = false;
        button.textContent = originalLabel;
      }
    }

    function makeWordBox(word, entry) {
      const wrapper = document.createElement("div");
      wrapper.className = "definition-box";

      const row = document.createElement("div");
      row.className = "word-row";

      const label = document.createElement("label");
      label.textContent = entry.part_of_speech ? `${word} (${entry.part_of_speech})` : word;
      row.appendChild(label);

      const button = document.createElement("button");
      button.type = "button";
      button.className = "card-button";
      button.textContent = "Generate Card";
      button.addEventListener("click", () => generateCard(word, entry, button));
      row.appendChild(button);

      const box = document.createElement("textarea");
      box.readOnly = true;
      const lines = [];
      if (entry.definition) lines.push(`Definition: ${entry.definition}`);
      if (entry.short_definition) lines.push(`Short definition: ${entry.short_definition}`);
      box.value = lines.join("\n\n") || "No definition available.";

      wrapper.appendChild(row);
      wrapper.appendChild(box);
      return wrapper;
    }

    function renderWordSections(seedWord, definitions) {
      seedWordContainer.innerHTML = "";
      wordsUsedContainer.innerHTML = "";
      for (const [word, entry] of Object.entries(definitions || {})) {
        const container = word === seedWord ? seedWordContainer : wordsUsedContainer;
        container.appendChild(makeWordBox(word, entry));
      }
    }

    runButton.addEventListener("click", async () => {
      const raw = dayInput.value.trim();
      const day = raw === "" ? null : Number(raw);

      runButton.disabled = true;
      status.textContent = "Generating press release...";
      seedWordContainer.innerHTML = "";
      wordsUsedContainer.innerHTML = "";
      cardSection.style.display = "none";
      wordCard.src = "";

      try {
        const response = await fetch("/api/press-release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ day }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        renderWordSections(data.seed_word, data.definitions);
        status.textContent = `Done (game day ${data.game_day ?? "current"}).`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
