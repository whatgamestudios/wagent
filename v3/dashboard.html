<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Worcadian Agent</title>
  <link rel="icon" type="image/png" href="https://whatgamestudios.com/worcadian/worcadian-logo.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2e9d8;
      --ink: #2b2420;
      --accent: #96682d;
      --panel: #fffdf8;
      --border: #d8c7a4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1712;
        --ink: #ece3d4;
        --accent: #d3a45e;
        --panel: #262019;
        --border: #4a3d2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }
    main {
      width: 100%;
      max-width: 720px;
    }
    h1 {
      text-align: center;
      letter-spacing: 0.04em;
      margin: 0 0 0.25rem;
    }
    .subtitle {
      text-align: center;
      color: var(--accent);
      font-style: italic;
      margin: 0 0 2rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.4rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    .field { flex: 1 1 200px; }
    input[type="number"] {
      width: 100%;
      padding: 0.55rem 0.65rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
    }
    button {
      padding: 0.6rem 1.1rem;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: var(--accent);
      color: var(--panel);
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    textarea {
      width: 100%;
      min-height: 320px;
      padding: 0.85rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink);
      resize: vertical;
    }
    .status {
      min-height: 1.2rem;
      margin: 0.5rem 0 0.75rem;
      font-style: italic;
      color: var(--accent);
    }
    .definitions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 0.5rem 0 1.5rem;
    }
    .definition-box textarea {
      min-height: 90px;
    }
    .word-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }
    .word-row label {
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.9rem;
      margin-bottom: 0;
    }
    .button-group {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .card-button, .tweet-button {
      padding: 0.3rem 0.7rem;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .card-row {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }
    #word-card {
      max-width: 100%;
      flex: 1 1 260px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .palette-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      flex: 0 0 auto;
    }
    .palette-swatch {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 2px solid var(--border);
      border-radius: 50%;
    }
    .secondary-button {
      background: var(--bg);
      color: var(--ink);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      max-width: 480px;
      width: 100%;
    }
    .modal p {
      margin: 0 0 1.25rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .modal-buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <main>
    <h1>Worcadian Agent</h1>
    <p class="subtitle">
      Daily press release generator ·
      <a href="/auth/logout" style="color: var(--accent);">Log out</a>
    </p>

    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="game-day">Game day</label>
          <input id="game-day" type="number" min="1" placeholder="Current game day" />
        </div>
        <button id="run-button" type="button">Execute Daily Tasks</button>
      </div>

      <div id="status" class="status"></div>

      <label>Seed Word</label>
      <div id="seed-word" class="definitions"></div>

      <label style="margin-top: 1.25rem;">Words Used</label>
      <div id="words-used" class="definitions"></div>

      <label style="margin-top: 1.25rem;">Free Entry</label>
      <div class="controls">
        <div class="field">
          <label for="free-word">Word</label>
          <input id="free-word" type="text" placeholder="e.g. ZYTHUM" />
        </div>
        <div class="field">
          <label for="free-pos">Type of word</label>
          <input id="free-pos" type="text" placeholder="e.g. noun" />
        </div>
      </div>
      <label for="free-definition">Definition</label>
      <textarea id="free-definition" style="min-height: 90px; margin-bottom: 0.75rem;" placeholder="Enter a definition"></textarea>
      <div class="button-group">
        <button id="free-entry-button" type="button">Generate Card</button>
        <button id="free-entry-tweet-button" type="button" class="tweet-button">Tweet</button>
      </div>

      <div id="card-section" style="display: none; margin-top: 1.25rem;">
        <label>
          Word Card ·
          <a href="/api/instagram/authorize" style="color: var(--accent);">Connect Instagram account</a>
        </label>
        <div class="card-row">
          <img id="word-card" alt="Word card" />
          <div id="palette-buttons" class="palette-buttons"></div>
        </div>
        <button id="submit-instagram-button" type="button" style="margin-top: 0.75rem;">Submit Image to Instagram</button>
      </div>

      <label style="margin-top: 1.25rem;">
        Tweet ·
        <a href="/api/x/authorize" style="color: var(--accent);">Connect X account</a>
      </label>
      <textarea id="tweet-text" style="min-height: 90px; margin-bottom: 0.75rem;" placeholder="A candidate tweet will appear here."></textarea>
      <button id="submit-tweet-button" type="button">Submit Tweet to x.com</button>
    </div>
  </main>

  <div id="tweet-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <p id="tweet-modal-text"></p>
      <div class="modal-buttons">
        <button id="tweet-modal-cancel" type="button" class="secondary-button">Cancel</button>
        <button id="tweet-modal-confirm" type="button">Yes Tweet</button>
      </div>
    </div>
  </div>

  <div id="instagram-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <p>Submit Word Card to Instagram</p>
      <div class="modal-buttons">
        <button id="instagram-modal-cancel" type="button" class="secondary-button">Cancel</button>
        <button id="instagram-modal-confirm" type="button">Submit</button>
      </div>
    </div>
  </div>

  <script>
    const runButton = document.getElementById("run-button");
    const dayInput = document.getElementById("game-day");
    const status = document.getElementById("status");
    const seedWordContainer = document.getElementById("seed-word");
    const wordsUsedContainer = document.getElementById("words-used");
    const cardSection = document.getElementById("card-section");
    const wordCard = document.getElementById("word-card");
    const freeWordInput = document.getElementById("free-word");
    const freePosInput = document.getElementById("free-pos");
    const freeDefinitionInput = document.getElementById("free-definition");
    const freeEntryButton = document.getElementById("free-entry-button");
    const freeEntryTweetButton = document.getElementById("free-entry-tweet-button");
    const paletteContainer = document.getElementById("palette-buttons");
    const tweetText = document.getElementById("tweet-text");
    const submitTweetButton = document.getElementById("submit-tweet-button");
    const tweetModalOverlay = document.getElementById("tweet-modal-overlay");
    const tweetModalText = document.getElementById("tweet-modal-text");
    const tweetModalConfirm = document.getElementById("tweet-modal-confirm");
    const tweetModalCancel = document.getElementById("tweet-modal-cancel");
    const submitInstagramButton = document.getElementById("submit-instagram-button");
    const instagramModalOverlay = document.getElementById("instagram-modal-overlay");
    const instagramModalConfirm = document.getElementById("instagram-modal-confirm");
    const instagramModalCancel = document.getElementById("instagram-modal-cancel");

    // Matches worcadian_agent/image_card.py's PALETTES -- the color shown on
    // each swatch is that palette's "accent" color.
    const PALETTES = [
      { name: "parchment", color: "#96682d" },
      { name: "midnight", color: "#7aa2f7" },
      { name: "forest", color: "#3a7d44" },
      { name: "rose", color: "#bf6179" },
      { name: "ocean", color: "#178aa8" },
      { name: "sunset", color: "#db6e27" },
      { name: "lavender", color: "#8b65c9" },
      { name: "slate", color: "#567189" },
      { name: "mustard", color: "#c4991d" },
      { name: "crimson", color: "#b02a2a" },
      { name: "mint", color: "#2d9774" },
      { name: "charcoal", color: "#c8a03c" },
    ];

    // The word/part-of-speech/definition behind whatever card is currently
    // shown, so a palette button can regenerate it without needing its own
    // copy of that data.
    let currentCardEntry = null;

    async function generateCard(word, entry, button, palette) {
      const isSwatch = button && button.classList.contains("palette-swatch");
      const originalLabel = isSwatch ? null : button.textContent;
      if (button) {
        button.disabled = true;
        if (!isSwatch) button.textContent = "Generating...";
      }
      const definition = entry.definition || entry.short_definition;
      currentCardEntry = { word, part_of_speech: entry.part_of_speech, definition };
      try {
        const response = await fetch("/api/word-card", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ word, part_of_speech: entry.part_of_speech, definition, palette }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        wordCard.src = data.card_image;
        cardSection.style.display = "block";
        cardSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (err) {
        status.textContent = `Error generating card: ${err.message}`;
      } finally {
        if (button) {
          button.disabled = false;
          if (!isSwatch) button.textContent = originalLabel;
        }
      }
    }

    function buildTweetText(word, definition) {
      return `Worcadian word of the day ${word}: ${definition}`;
    }

    function showTweet(word, entry) {
      const definition = entry.definition || entry.short_definition;
      if (!definition) {
        status.textContent = "No definition available to tweet for this word.";
        return;
      }
      tweetText.value = buildTweetText(word, definition);
      tweetText.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    submitTweetButton.addEventListener("click", () => {
      const text = tweetText.value.trim();
      if (!text) {
        status.textContent = "Nothing to tweet yet.";
        return;
      }
      tweetModalText.textContent = `Tweet: ${text}`;
      tweetModalOverlay.style.display = "flex";
    });

    tweetModalCancel.addEventListener("click", () => {
      tweetModalOverlay.style.display = "none";
    });

    tweetModalConfirm.addEventListener("click", async () => {
      const text = tweetText.value.trim();
      const originalLabel = tweetModalConfirm.textContent;
      tweetModalConfirm.disabled = true;
      tweetModalConfirm.textContent = "Tweeting...";
      try {
        const response = await fetch("/api/tweet", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        tweetModalOverlay.style.display = "none";
        status.textContent = "Tweet posted.";
      } catch (err) {
        status.textContent = `Error posting tweet: ${err.message}`;
      } finally {
        tweetModalConfirm.disabled = false;
        tweetModalConfirm.textContent = originalLabel;
      }
    });

    submitInstagramButton.addEventListener("click", () => {
      if (!wordCard.src) {
        status.textContent = "Generate a word card first.";
        return;
      }
      instagramModalOverlay.style.display = "flex";
    });

    instagramModalCancel.addEventListener("click", () => {
      instagramModalOverlay.style.display = "none";
    });

    instagramModalConfirm.addEventListener("click", async () => {
      const originalLabel = instagramModalConfirm.textContent;
      instagramModalConfirm.disabled = true;
      instagramModalConfirm.textContent = "Submitting...";
      try {
        const response = await fetch("/api/instagram-post", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image_data_url: wordCard.src, caption: "" }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        instagramModalOverlay.style.display = "none";
        status.textContent = "Posted to Instagram.";
      } catch (err) {
        status.textContent = `Error posting to Instagram: ${err.message}`;
      } finally {
        instagramModalConfirm.disabled = false;
        instagramModalConfirm.textContent = originalLabel;
      }
    });

    function renderPaletteButtons() {
      paletteContainer.innerHTML = "";
      for (const p of PALETTES) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "palette-swatch";
        button.style.background = p.color;
        button.title = p.name.charAt(0).toUpperCase() + p.name.slice(1);
        button.addEventListener("click", () => {
          if (!currentCardEntry) {
            status.textContent = "Generate a word card first, then choose a color palette.";
            return;
          }
          generateCard(currentCardEntry.word, currentCardEntry, button, p.name);
        });
        paletteContainer.appendChild(button);
      }
    }
    renderPaletteButtons();

    freeEntryButton.addEventListener("click", () => {
      const word = freeWordInput.value.trim();
      const definition = freeDefinitionInput.value.trim();
      if (!word || !definition) {
        status.textContent = "Enter both a word and a definition first.";
        return;
      }
      generateCard(word, { part_of_speech: freePosInput.value.trim() || null, definition }, freeEntryButton);
    });

    freeEntryTweetButton.addEventListener("click", () => {
      const word = freeWordInput.value.trim();
      const definition = freeDefinitionInput.value.trim();
      if (!word || !definition) {
        status.textContent = "Enter both a word and a definition first.";
        return;
      }
      showTweet(word, { definition });
    });

    function makeWordBox(word, entry) {
      const wrapper = document.createElement("div");
      wrapper.className = "definition-box";

      const row = document.createElement("div");
      row.className = "word-row";

      const label = document.createElement("label");
      label.textContent = entry.part_of_speech ? `${word} (${entry.part_of_speech})` : word;
      row.appendChild(label);

      const buttonGroup = document.createElement("div");
      buttonGroup.className = "button-group";

      const cardButton = document.createElement("button");
      cardButton.type = "button";
      cardButton.className = "card-button";
      cardButton.textContent = "Generate Card";
      cardButton.addEventListener("click", () => generateCard(word, entry, cardButton));
      buttonGroup.appendChild(cardButton);

      const tweetButton = document.createElement("button");
      tweetButton.type = "button";
      tweetButton.className = "tweet-button";
      tweetButton.textContent = "Tweet";
      tweetButton.addEventListener("click", () => showTweet(word, entry));
      buttonGroup.appendChild(tweetButton);

      row.appendChild(buttonGroup);

      const box = document.createElement("textarea");
      box.readOnly = true;
      const lines = [];
      if (entry.definition) lines.push(`Definition: ${entry.definition}`);
      if (entry.short_definition) lines.push(`Short definition: ${entry.short_definition}`);
      box.value = lines.join("\n\n") || "No definition available.";

      wrapper.appendChild(row);
      wrapper.appendChild(box);
      return wrapper;
    }

    function renderWordSections(seedWord, definitions) {
      seedWordContainer.innerHTML = "";
      wordsUsedContainer.innerHTML = "";
      for (const [word, entry] of Object.entries(definitions || {})) {
        const container = word === seedWord ? seedWordContainer : wordsUsedContainer;
        container.appendChild(makeWordBox(word, entry));
      }
    }

    runButton.addEventListener("click", async () => {
      const raw = dayInput.value.trim();
      const day = raw === "" ? null : Number(raw);

      runButton.disabled = true;
      status.textContent = "Generating press release...";
      seedWordContainer.innerHTML = "";
      wordsUsedContainer.innerHTML = "";
      cardSection.style.display = "none";
      wordCard.src = "";
      currentCardEntry = null;
      tweetText.value = "";
      tweetModalOverlay.style.display = "none";
      instagramModalOverlay.style.display = "none";

      try {
        const response = await fetch("/api/press-release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ day }),
        });
        if (response.status === 401) {
          window.location.href = "/auth/login";
          return;
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || `Request failed with status ${response.status}`);
        }
        renderWordSections(data.seed_word, data.definitions);
        status.textContent = `Done (game day ${data.game_day ?? "current"}).`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        runButton.disabled = false;
      }
    });
  </script>
</body>
</html>
